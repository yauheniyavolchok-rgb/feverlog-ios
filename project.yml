name: FeverLog
options:
  bundleIdPrefix: com.drbaby
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FeverLogEngine:
    path: FeverLogEngine
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.2

targets:
  FeverLog:
    type: application
    platform: iOS
    sources:
      - path: FeverLog
    resources:
      - path: FeverLog/Localization
      - path: FeverLog/Assets.xcassets
    dependencies:
      - package: FeverLogEngine
        product: FeverLogEngine
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drbaby.feverlog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeverLog
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: FeverLog/FeverLog.entitlements
    info:
      path: FeverLog/Info.plist
      properties:
        CFBundleLocalizations: [en]
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        NSHumanReadableCopyright: ""
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.drbaby.feverlog

  FeverLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeverLogTests
    dependencies:
      - target: FeverLog
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  FeverLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FeverLogUITests
    dependencies:
      - target: FeverLog
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FeverLog:
    build:
      targets:
        FeverLog: all
        FeverLogTests: [test]
        FeverLogUITests: [test]
    test:
      targets:
        - FeverLogTests
        - FeverLogUITests
      gatherCoverage: true
    run:
      config: Debug
    archive:
      config: Release
